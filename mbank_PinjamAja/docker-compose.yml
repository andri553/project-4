version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mbank_postgres
    environment:
      POSTGRES_USER: mbank_user
      POSTGRES_PASSWORD: mbank_password
      POSTGRES_DB: mbank_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mbank_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mbank_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mbank_mq
      RABBITMQ_DEFAULT_PASS: mbank_mq_pass
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
